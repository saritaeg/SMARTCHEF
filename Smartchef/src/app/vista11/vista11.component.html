<div class="vista11">

  <header class="top-bar">
    <div class="icon-left" (click)="volver()">&#x276E;</div>
    <img src="assets/logosmartchef.png" class="logo" alt="Logo" />
    <div class="icon-right"></div>
  </header>

  <div class="divider"></div>

  <h2 class="titulo">Añadir nueva receta</h2>
  <p class="subtitulo">Rellena los campos para crear tu receta</p>

  <div class="form-container">

    <div class="form-field">
      <label>Título de la receta</label>
      <input type="text" [(ngModel)]="receta.titulo" placeholder="Ej: Pinchito de pollo" />
    </div>

    <div class="form-field">
      <label>Imagen de la receta</label>

      <button class="btn-camera" *ngIf="!mostrarCamara" (click)="iniciarCamara()">
        📷 Tomar Foto
      </button>

      <div *ngIf="mostrarCamara" class="camera-container">
        <video #videoElement autoplay playsinline style="width: 100%; max-height: 300px; background: black;"></video>
        <div class="camera-buttons">
          <button class="btn-confirm" (click)="tomarFoto()">Capturar</button>
          <button class="btn-cancel" (click)="detenerCamara()">Cerrar</button>
        </div>
      </div>

      <canvas #canvasElement style="display: none;"></canvas>

      <input type="text" [(ngModel)]="receta.img" placeholder="URL de la imagen (o toma una foto)" />

      <img *ngIf="receta.img" [src]="receta.img" alt="Vista previa" style="width: 100%; margin-top: 10px; border-radius: 8px;">
    </div>
    <div class="form-field">
      <label>Descripción</label>
      <textarea [(ngModel)]="receta.descripcion" placeholder="Descripción breve"></textarea>
    </div>

    <div class="form-field">
      <label>Tiempo de preparación</label>
      <input type="text" [(ngModel)]="receta.tiempo" placeholder="Ej: 30 min" />
    </div>

    <div class="form-field">
      <label>Porciones</label>
      <input type="number" [(ngModel)]="receta.porciones" min="1" placeholder="4" />
    </div>

    <div class="form-field">
      <label>Ingredientes</label>
      <textarea [(ngModel)]="receta.ingredientes" placeholder="Separados por comas"></textarea>
    </div>

    <div class="form-field">
      <label>Pasos</label>
      <textarea [(ngModel)]="receta.pasos" placeholder="Separados por comas"></textarea>
    </div>

    <div class="form-buttons">
      <button class="btn-confirm" (click)="confirmar()">Confirmar</button>
      <button class="btn-cancel" (click)="volver()">Cancelar</button>
    </div>

  </div>
</div>
